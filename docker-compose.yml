version: '3.8'

services:
  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
    container_name: siso-pipeline-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8001
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api
    networks:
      - pipeline-network

  # FastAPI Application
  api:
    build: .
    container_name: siso-pipeline-api
    ports:
      - "8001:8001"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - WEAVIATE_URL=http://weaviate:8080
      - DATABASE_URL=postgresql://postgres:1234@postgres:5432/siso_pipeline
    env_file:
      - .env
    volumes:
      - ./app:/app/app
      - ./templates:/app/templates
      - ./temp_files:/app/temp_files
      - ./temp_image_summaries:/app/temp_image_summaries
      - ./logs:/app/logs
    depends_on:
      - redis
      - weaviate
      - postgres
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    networks:
      - pipeline-network

  # Parallel RQ Workers for documents, fields, and projects
  workers:
    build: .
    container_name: siso-pipeline-workers
    environment:
      - REDIS_URL=redis://redis:6379/0
      - WEAVIATE_URL=http://weaviate:8080
      - DATABASE_URL=postgresql://postgres:1234@postgres:5432/siso_pipeline
      # Hierarchical worker mode
      - USE_HIERARCHICAL_WORKERS=${USE_HIERARCHICAL_WORKERS:-false}
      - NUM_DOC_WORKERS_PER_PROJECT=${NUM_DOC_WORKERS_PER_PROJECT:-2}
      - NUM_FIELD_WORKERS_PER_DOC=${NUM_FIELD_WORKERS_PER_DOC:-5}
      # Traditional parallel mode
      - NUM_DOC_WORKERS=${NUM_DOC_WORKERS:-2}
      - NUM_FIELD_WORKERS=${NUM_FIELD_WORKERS:-10}
      - NUM_PROJECT_WORKERS=${NUM_PROJECT_WORKERS:-1}
    env_file:
      - .env
    volumes:
      - ./app:/app/app
      - ./templates:/app/templates
      - ./temp_files:/app/temp_files
      - ./temp_image_summaries:/app/temp_image_summaries
      - ./logs:/app/logs
    depends_on:
      - redis
      - weaviate
      - postgres
    # Use parallel launcher to spawn separate workers for docs, fields, and projects
    command: python -m app.utils.worker_launcher_parallel
    networks:
      - pipeline-network

  # PostgreSQL for LiteLLM and Application
  postgres:
    image: postgres:16-alpine
    container_name: siso-pipeline-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=1234
      - POSTGRES_DB=litellm
      - POSTGRES_MULTIPLE_DATABASES=siso_pipeline
    ports:
      - "5433:5432"  # Expose PostgreSQL on host port 5433
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - pipeline-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # LiteLLM Proxy
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: siso-pipeline-litellm
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_API_KEY_2=${OPENAI_API_KEY_2}
      - OPENAI_API_KEY_3=${OPENAI_API_KEY_3}
      - OPENAI_API_KEY_4=${OPENAI_API_KEY_4}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      # - REDIS_HOST=${REDIS_HOST:-redis}
      # - REDIS_PORT=${REDIS_PORT:-6379}
    volumes:
      - ./litellm/config.yaml:/app/config.yaml
    command: --config /app/config.yaml --port 4000 --num_workers ${LITELLM_NUM_WORKERS:-4}
    networks:
      - pipeline-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: siso-pipeline-redis
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    networks:
      - pipeline-network

  # Weaviate Vector Database
  weaviate:
    image: semitechnologies/weaviate:1.24.4
    container_name: siso-pipeline-weaviate
    ports:
      - "8085:8080"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'none'
      ENABLE_MODULES: ''
      CLUSTER_HOSTNAME: 'node1'
    volumes:
      - weaviate-data:/var/lib/weaviate
    networks:
      - pipeline-network

volumes:
  redis-data:
  weaviate-data:
  postgres-data:

networks:
  pipeline-network:
    driver: bridge
